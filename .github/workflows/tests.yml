name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser version matches the Python rules
        run: |
          python scripts/export_web.py
          git diff --exit-code docs/patterns.js || (echo "Run: python scripts/export_web.py" && exit 1)
          node tests/web/test_engine.mjs
